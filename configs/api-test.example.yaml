# api-test reference config. Copy to api-test.yaml and edit. Every knob
# has a sensible default; only fields you care about overriding need to
# appear in your own file.

server:
  name: api-test
  address: ":8080"
  base_url: "http://localhost:8080"
  read_header_timeout: 10s
  shutdown:
    grace_period: 25s
    pre_shutdown_delay: 2s
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

# OIDC validates JWTs the Plexara gateway sends after exchanging
# client_credentials or auth_code with the IdP. Keycloak provides this in
# dev (configs/api-test.live.yaml). Disabled here.
oidc:
  enabled: false
  issuer: "${APITEST_OIDC_ISSUER:-http://localhost:8081/realms/api-test}"
  audience: "${APITEST_OIDC_AUDIENCE:-api-test}"
  allowed_clients: []
  clock_skew_seconds: 30
  jwks_cache_ttl: 1h
  skip_signature_verification: false  # requires APITEST_INSECURE=1 if true

# Static API keys for inbound auth_mode=api_key (header or query).
api_keys:
  header_name: "X-API-Key"
  query_param_name: "api_key"
  file:
    - { name: "devkey", key: "${APITEST_DEV_KEY:-devkey-please-change}", description: "default dev key" }
  db:
    enabled: false

# Static bearer tokens for inbound auth_mode=bearer.
bearer:
  tokens:
    - { name: "devbearer", token: "${APITEST_DEV_BEARER:-bearer-please-change}", description: "default dev bearer" }

auth:
  allow_anonymous: false
  require_for_api: true
  require_for_portal: true

database:
  url: "${APITEST_DB_URL:-postgres://api:api@localhost:5432/apitest?sslmode=disable}"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h

audit:
  enabled: true
  retention_days: 7        # api-test responses can be huge; keep window small
  capture_payloads: true
  capture_headers: true
  max_payload_bytes: 1048576  # 1 MiB; oversize bodies write headers-only

portal:
  enabled: true
  cookie_name: "api_test_session"
  cookie_secret: "${APITEST_COOKIE_SECRET}"
  cookie_secure: false
  oidc_redirect_path: "/portal/auth/callback"

endpoints:
  identity:   { enabled: true }
  data:       { enabled: true }
  failure:    { enabled: true }
  echo:       { enabled: true }
  streaming:  { enabled: true }
  pagination: { enabled: true }
  methods:    { enabled: true }
  security:   { enabled: true }
  export:     { enabled: true }

# Optional: POST a connection definition to a Plexara admin URL on boot
# so api-test self-registers in dev. Default off; keep fixture decoupled.
plexara:
  register:
    enabled: false
    admin_url: "${PLEXARA_ADMIN_URL:-http://localhost:9000/api/v1/admin/api-gateway/connections}"
    auth_header: "${PLEXARA_ADMIN_AUTH:-}"
    connection_name: "api-test"
